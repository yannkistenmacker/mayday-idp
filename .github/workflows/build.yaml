name: Build and Push Backstage

on:
  push:
    branches:
      - main
    pull_request:
      branches:
        - main
    paths:
      - 'backstage/**'
      - '.github/workflows/*'

env:
  IMAGE_NAME: kisten/backstage

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: backstage/yarn.lock

      - name: Install dependencies
        working-directory: backstage
        run: yarn install --immutable

      - name: Generate types
        working-directory: backstage
        run: yarn tsc

      - name: Build backend
        working-directory: backstage/
        run: yarn build:backend

      - name: Set image tags
        id: vars
        run: |
          echo "SHA_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VERSION=v${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backstage
          file: ./backstage/packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitOps write-back: pin the just-built image (by commit SHA) into the
      # Helm values that Argo CD renders. main is protected by a ruleset that
      # requires a PR (1 approval), so instead of pushing to main we open a PR
      # with the bump. Merge it to deploy. Runs only on push to main, never PRs.
      # The bump branch touches only charts/backstage/**, outside this
      # workflow's trigger paths, so merging it won't re-trigger the build.
      - name: Open PR to bump image tag (GitOps write-back)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VALUES=charts/backstage/values.yaml
          # yq (mikefarah) — install locally to the runner tmp if not present.
          if ! command -v yq >/dev/null 2>&1; then
            curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
            chmod +x "$RUNNER_TEMP/yq"
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          yq -i '.image.tag = strenv(SHA_TAG)' "$VALUES"
          if git diff --quiet -- "$VALUES"; then
            echo "Image tag unchanged; nothing to do."
            exit 0
          fi
          BRANCH="deploy/bump-${SHA_TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$VALUES"
          git commit -m "chore(deploy): backstage image tag -> ${SHA_TAG}"
          git push -f origin "$BRANCH"
          # Open the PR (idempotent: ignore error if one already exists for this branch).
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deploy): backstage image -> ${SHA_TAG}" \
            --body "Automated image bump to \`${SHA_TAG}\`. Merge to deploy via Argo CD." \
            || echo "PR already exists for ${BRANCH}"
