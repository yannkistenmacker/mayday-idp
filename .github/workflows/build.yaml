name: Build and Push Backstage

on:
  push:
    branches:
      - main
    paths:
      - 'backstage/**'

env:
  IMAGE_NAME: kisten/backstage

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: backstage/yarn.lock

      - name: Install dependencies
        working-directory: backstage
        run: yarn install --immutable

      - name: Generate types
        working-directory: backstage
        run: yarn tsc

      - name: Build backend
        working-directory: backstage
        run: yarn build:backend

      - name: Set image tags
        id: vars
        run: |
          echo "SHA_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VERSION=v${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backstage
          file: ./backstage/packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
