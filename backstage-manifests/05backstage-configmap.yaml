apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.production.yaml: |
    app:
      title: Backstage
      baseUrl: https://backstage.local

    backend:
      baseUrl: https://backstage.local
      listen:
        port: 7007
        host: 0.0.0.0
      cors:
        origin: https://backstage.local

      database:
        client: pg
        connection:
          host: postgres.backstage.svc.cluster.local
          port: 5432
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: backstage
