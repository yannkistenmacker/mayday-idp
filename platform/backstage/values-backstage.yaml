app:
  title: Platform Backstage
  baseUrl: http://localhost:30007

backend:
  baseUrl: http://localhost.12:30007
  listen:
    port: 7007
  backend:
  auth:
    keys:
      - secret: ${BACKSTAGE_AUTH_SECRET}

  database:
    client: sqlite3
    connection: ':memory:'

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

extraEnvVars:
  - name: BACKSTAGE_AUTH_SECRET
    valueFrom:
      secretKeyRef:
        name: backstage-auth-secret
        key: BACKSTAGE_AUTH_SECRET


auth:
  providers:
    guest:
      enabled: true

