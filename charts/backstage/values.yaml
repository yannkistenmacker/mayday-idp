replicaCount: 3

image:
  repository: kisten/backstage
  # tag is the single source of truth for what gets deployed.
  # CI (build.yaml) bumps this to the built commit SHA on every push to main.
  tag: "8aa52be"
  pullPolicy: IfNotPresent

containerPort: 7007

# Args passed to `node` in the container.
args:
  - packages/backend
  - --config
  - app-config.yaml
  - --config
  - app-config.production.yaml

# Secrets injected as env into the container.
extraEnvFrom:
  - secretRef:
      name: postgres-secrets
  - secretRef:
      name: backstage-secrets

# Argo Rollouts canary strategy.
rollout:
  canary:
    steps:
      - setWeight: 20
      - pause: { duration: 60 }
      - setWeight: 50
      - pause: { duration: 60 }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  host: backstage.local
  tls:
    enabled: true
    secretName: backstage-tls

# App configuration rendered into the backstage-config ConfigMap.
config:
  title: Backstage
  baseUrl: https://backstage.local
  database:
    host: postgres.backstage.svc.cluster.local
    port: 5432
    name: backstage

# backstage-secrets is NOT managed by this chart. It is provided as an
# encrypted SealedSecret (charts/backstage/templates/sealedsecret.yaml),
# generated by scripts/seal-backstage-secret.sh and decrypted in-cluster by the
# sealed-secrets controller. No plaintext/base64 secret lives in Git.
# Set create=true only if you deliberately want the chart to render a plaintext
# Secret (not recommended).
secret:
  create: false
